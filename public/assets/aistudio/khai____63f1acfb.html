<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf1;--ink:#0f2a3d;--mute:#5d7283;--card:#fff;--teal:#0a7c73;--coral:#d4473d;--line:#d5dde4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri",sans-serif;padding-bottom:84px}
.wrap{max-width:560px;margin:auto;padding:16px}
.hidden{display:none!important}
h1,h2,.big{font-family:"Tiro Bangla",serif;font-weight:400;margin:0}
button,input{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:500;background:var(--ink);color:#fff}
button.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
button.danger{background:transparent;border:1.5px solid var(--coral);color:var(--coral)}
button.sm{padding:6px 12px;font-size:14px}
.sug{background:#fff;border:1.5px solid var(--line);border-radius:10px;margin-top:6px;max-height:220px;overflow:auto}
.sug div{padding:11px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid var(--bg)}
.sug div:last-child{border-bottom:0}.sug small{color:var(--coral);font-size:14px}
button.ico{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--teal)}
button.ico svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}
input:focus,select:focus,button:focus-visible{outline:3px solid #0a7c7355;border-color:var(--teal)}
label{display:block;margin-top:14px;font-weight:500;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:18px}
.card+.card{margin-top:14px}
.mute{color:var(--mute);font-size:14px}

/* login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:420px;margin:auto}
#login h1{font-size:54px;line-height:1}
#login p{color:var(--mute);margin:10px 0 28px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:14px;font-size:17px}

/* dashboard */
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:22px 20px}
.hero .lbl{opacity:.7;font-size:15px}
.hero .big{font-size:46px;line-height:1.15;margin:2px 0 16px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--coral)}
.bar i{background:#3fd1c4;display:block;transition:width .4s}
.hero .two{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.hero .two b{display:block;font-size:18px;font-weight:500}
.hero .two div:last-child{text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
.sec h2{font-size:22px}
.p{background:var(--card);border-radius:16px;margin-top:10px;overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:"Tiro Bangla",serif;font-size:20px;flex:none}
.pn{flex:1;min-width:0}
.pn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{height:4px;border-radius:2px;background:var(--coral);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--teal)}
.amt{font-family:"Tiro Bangla",serif;font-size:20px;color:var(--coral);white-space:nowrap}
.amt.ok{color:var(--teal);font-size:16px}
.pb{border-top:1px dashed var(--line);padding:6px 14px 14px}
.r{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bg)}
.r .d{flex:1;min-width:0}
.r small{display:block;color:var(--mute)}
.r .m{font-weight:600}
.r .m.t{color:var(--coral)}.r .m.g{color:var(--teal)}
.empty{text-align:center;color:var(--mute);padding:28px 0}

/* entry */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:12px;margin-top:6px}
.seg button{background:transparent;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.seg button.on[data-t=take]{color:var(--coral)}
.seg button.on[data-t=return]{color:var(--teal)}
#saveBtn{width:100%;margin-top:20px;padding:14px;font-size:17px;background:var(--teal)}

/* settings */
.me{display:flex;gap:14px;align-items:center}
.me img{width:52px;height:52px;border-radius:50%;background:var(--bg)}
.me b{display:block}
.btns{display:grid;gap:10px;margin-top:14px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:560px;width:100%;gap:4px}
nav button{flex:1;background:transparent;color:var(--mute);padding:8px 4px;border-radius:12px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);background:var(--bg)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
#report{display:none}
#report h1{font-size:24px;margin:0 0 4px}
#report table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
#report th,#report td{border:1px solid #999;padding:6px 8px;text-align:left}
#report th{background:#eee}
#report td.n,#report th.n{text-align:right}
@page{margin:14mm}
@media print{body>*:not(#report){display:none!important}#report{display:block;color:#000}body{background:#fff;padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="app" class="wrap">

<section id="v-dash">
<div class="hero">
<div class="lbl">মোট বাকি</div>
<div class="big" id="totalDue">৳ ০</div>
<div class="bar"><i id="bar" style="width:0"></i></div>
<div class="two">
<div><span class="dot" style="background:#3fd1c4"></span>ফেরত<b id="totalPaid">৳ ০</b></div>
<div>মোট নিয়েছে<b id="totalTaken">৳ ০</b></div>
</div>
</div>
<div class="sec"><h2>কার কাছে কত</h2><button id="addCust" class="ico" aria-label="নতুন কাস্টমার" title="নতুন কাস্টমার"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
<input id="search" placeholder="নাম খুঁজুন" style="margin:0">
<div id="peopleList"></div>
</section>

<section id="v-entry" class="hidden">
<div class="card">
<h2 id="entryTitle" style="font-size:26px">নতুন এন্ট্রি</h2>
<label>লেনদেনের ধরন</label>
<div class="seg" id="seg"><button data-t="take" class="on">টাকা নিয়েছে</button><button data-t="return">ফেরত দিয়েছে</button></div>
<label>কাস্টমার</label><input id="person" autocomplete="off" placeholder="নাম লিখুন বা বেছে নিন"><div id="sug" class="sug hidden"></div>
<label>টাকার পরিমাণ</label><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="০">
<label>তারিখ</label><input id="date" type="date">
<label>বিবরণ</label><input id="note" placeholder="ঐচ্ছিক">
<button id="saveBtn">সেভ করুন</button>
<button class="ghost hidden" id="cancelBtn" style="width:100%;margin-top:10px">বাতিল</button>
</div>
</section>

<section id="v-set" class="hidden">
<div class="card">
<h2 style="font-size:22px">ব্যাকআপ</h2>
<p class="mute" style="margin:6px 0 0">হিসাব এই ফোনের ব্রাউজারে সেভ থাকে। মাঝে মাঝে ফাইল ডাউনলোড করে রাখুন।</p>
<div class="btns">
<button id="bkPdf">PDF রিপোর্ট</button>
<button class="ghost" id="bkDl">ব্যাকআপ ডাউনলোড</button>
<button class="ghost" id="bkRs">ফাইল থেকে ফিরিয়ে আনুন</button>
<input id="restore" type="file" accept=".json" class="hidden">
</div>
</div>

<div class="card">
<h2 style="font-size:22px">রিসাইকেল বিন</h2>
<p class="mute" style="margin:6px 0 0">ডিলিট করা হিসাব ৩০ দিন এখানে থাকে। চাইলে ফিরিয়ে আনতে পারবেন।</p>
<div id="binList"></div>
<button class="danger sm hidden" id="binClear" style="margin-top:12px">বিন খালি করুন</button>
</div>
</section>

</main>

<nav id="nav"><div>
<button data-v="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.500"/><rect x="14" y="3" width="7" height="5" rx="1.500"/><rect x="14" y="12" width="7" height="9" rx="1.500"/><rect x="3" y="16" width="7" height="5" rx="1.500"/></svg>ড্যাশবোর্ড</button>
<button data-v="entry"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>এন্ট্রি</button>
<button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.100a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.100a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>সেটিং</button>
</div></nav>
<div id="report"></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const bn=n=>Number(n||0).toLocaleString("bn-BD",{maximumFractionDigits:2});
const money=n=>"৳ "+bn(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let tx=[],editing=null,openName="",type="take";
const KEY="ledger",CKEY="customers",BKEY="bin";
let cust=[],bin=[];

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)}

/* ---------- data ---------- */
function persist(){ls.set(KEY,tx)}
function persistC(){ls.set(CKEY,cust)}
function persistB(){ls.set(BKEY,bin)}
function toBin(o){bin.unshift({bid:Date.now()+Math.random(),at:Date.now(),...o});persistB()}
function renderBin(){
  $("binClear").classList.toggle("hidden",!bin.length);
  $("binList").innerHTML=bin.length?bin.map(b=>{
    const dd=Math.max(0,30-Math.floor((Date.now()-b.at)/864e5));
    const info=b.kind==="tx"?`<b>${esc(b.tx.person)}</b><small>${b.tx.type==="take"?"নিয়েছে":"ফেরত"} ${money(b.tx.amount)} · ${esc(b.tx.date)}${b.tx.note?" · "+esc(b.tx.note):""}</small>`
      :`<b>${esc(b.name)} (কাস্টমার)</b><small>${bn(b.txs.length)}টি লেনদেনসহ</small>`;
    return`<div class="r"><div class="d">${info}<small>আর ${bn(dd)} দিন থাকবে</small></div>
      <button class="ghost sm" data-rs="${b.bid}">ফিরিয়ে আনুন</button><button class="danger sm" data-pg="${b.bid}">মুছুন</button></div>`}).join("")
    :'<div class="empty">বিন খালি</div>';
}
function sum(name){const r=tx.filter(t=>t.person.toLowerCase()===name.toLowerCase());
  const taken=r.filter(t=>t.type==="take").reduce((s,t)=>s+t.amount,0),ret=r.filter(t=>t.type==="return").reduce((s,t)=>s+t.amount,0);
  return{taken,ret,due:taken-ret,rows:r}}
const names=()=>{const m=new Map();[...cust,...tx.map(t=>t.person)].forEach(p=>{const k=p.toLowerCase();if(!m.has(k))m.set(k,p)});return[...m.values()]};
function addCust(n){n=n.trim();if(!n)return"";const ex=names().find(x=>x.toLowerCase()===n.toLowerCase())||n;
  if(!cust.some(c=>c.toLowerCase()===ex.toLowerCase())){cust.push(ex);persistC()}return ex}

/* ---------- render ---------- */
function render(){fillSel();renderBin();
  const ns=names();let T=0,R=0;ns.forEach(n=>{const s=sum(n);T+=s.taken;R+=s.ret});
  $("totalDue").textContent=money(T-R);$("totalPaid").textContent=money(R);$("totalTaken").textContent=money(T);
  $("bar").style.width=(T?Math.min(100,R/T*100):0)+"%";
  const q=$("search").value.toLowerCase().trim();
  const list=ns.filter(n=>n.toLowerCase().includes(q)).sort((a,b)=>sum(b).due-sum(a).due);
  $("peopleList").innerHTML=list.map(n=>{
    const s=sum(n),isOpen=n===openName;
    const rows=isOpen?`<div class="pb">${s.rows.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).map(t=>`
      <div class="r"><div class="d"><b>${esc(t.note||(t.type==="take"?"নিয়েছে":"ফেরত দিয়েছে"))}</b><small>${esc(t.date)}</small></div>
      <span class="m ${t.type==="take"?"t":"g"}">${t.type==="take"?"+":"−"}${money(t.amount)}</span>
      <button class="ghost sm" data-edit="${t.id}">এডিট</button><button class="danger sm" data-del="${t.id}">ডিলিট</button></div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:12px"><button class="sm" data-pdf="${esc(n)}">PDF</button><button class="danger sm" data-delp="${esc(n)}">কাস্টমার মুছুন</button></div></div>`:"";
    return`<div class="p"><div class="ph" data-open="${esc(n)}"><div class="av">${esc([...n][0]||"?")}</div>
      <div class="pn"><b>${esc(n)}</b><div class="mini"><i style="width:${s.taken?Math.min(100,s.ret/s.taken*100):0}%"></i></div></div>
      ${s.due>0?`<div class="amt">${money(s.due)}</div>`:`<div class="amt ok">${s.rows.length?"পরিশোধ ✓":"এন্ট্রি নেই"}</div>`}</div>${rows}</div>`}).join("")
    ||'<div class="empty">এখনো কোনো হিসাব নেই।<br>নিচে “এন্ট্রি” থেকে শুরু করুন।</div>';
}

/* ---------- pdf ---------- */
function pdf(name){
  if(!tx.length){toast("কোনো হিসাব নেই");return}
  const rows=(name?sum(name).rows:tx).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  let h=`<h1>খাতা${name?" — "+esc(name):""}</h1><div>তারিখ: ${new Date().toLocaleDateString("bn-BD")}</div>`;
  if(!name){
    let T=0,R=0;
    h+='<table><tr><th>নাম</th><th class="n">নিয়েছে</th><th class="n">ফেরত</th><th class="n">বাকি</th></tr>'+
      names().map(n=>{const s=sum(n);T+=s.taken;R+=s.ret;return`<tr><td>${esc(n)}</td><td class="n">${money(s.taken)}</td><td class="n">${money(s.ret)}</td><td class="n">${money(s.due)}</td></tr>`}).join("")+
      `<tr><th>মোট</th><th class="n">${money(T)}</th><th class="n">${money(R)}</th><th class="n">${money(T-R)}</th></tr></table>`;
  }else{const s=sum(name);h+=`<div>নিয়েছে: ${money(s.taken)} | ফেরত: ${money(s.ret)} | <b>বাকি: ${money(s.due)}</b></div>`}
  let bal=0;
  h+='<table><tr><th>তারিখ</th>'+(name?"":"<th>নাম</th>")+'<th>বিবরণ</th><th>ধরন</th><th class="n">টাকা</th>'+(name?'<th class="n">বাকি</th>':"")+'</tr>'+
    rows.map(t=>{bal+=t.type==="take"?t.amount:-t.amount;
      return`<tr><td>${esc(t.date)}</td>${name?"":`<td>${esc(t.person)}</td>`}<td>${esc(t.note||"-")}</td><td>${t.type==="take"?"নিয়েছে":"ফেরত"}</td><td class="n">${money(t.amount)}</td>${name?`<td class="n">${money(bal)}</td>`:""}</tr>`}).join("")+'</table>';
  $("report").innerHTML=h;setTimeout(()=>window.print(),150);
}

/* ---------- entry ---------- */
function fillSel(){
  const box=$("sug");
  if(document.activeElement!==$("person")){box.classList.add("hidden");return}
  const r=type==="return",q=$("person").value.trim().toLowerCase();
  const ns=names().filter(n=>(!r||sum(n).due>0)&&n.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b,"bn"));
  if(!ns.length){box.classList.add("hidden");return}
  box.innerHTML=ns.map(n=>{const d=sum(n).due;return`<div data-n="${esc(n)}"><span>${esc(n)}</span>${d>0?`<small>বাকি ${money(d)}</small>`:""}</div>`}).join("");
  box.classList.remove("hidden");
}
function setType(t,name){type=t;document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(name!==undefined)$("person").value=name;fillSel()}
function resetForm(){editing=null;$("person").value="";setType("take","");$("amount").value="";$("note").value="";
  $("date").value=new Date().toLocaleDateString("en-CA");$("saveBtn").textContent="সেভ করুন";$("entryTitle").textContent="নতুন এন্ট্রি";$("cancelBtn").classList.add("hidden")}
function save(){
  let person=$("person").value.trim();const amount=Number($("amount").value),date=$("date").value;
  if(!person||!date||!Number.isFinite(amount)||amount<=0){toast("কাস্টমার, তারিখ ও সঠিক টাকা দিন");return}
  const ex=names().find(n=>n.toLowerCase()===person.toLowerCase());
  if(type==="return"&&!ex){toast("এই নামে কাস্টমার নেই");return}
  person=type==="return"?ex:addCust(person);
  const old=editing?tx.find(t=>t.id===editing):null;
  if(type==="return"){let av=sum(person).due;if(old&&old.type==="return"&&old.person.toLowerCase()===person.toLowerCase())av+=old.amount;
    if(amount>av){toast("এত টাকা বাকি নেই। বাকি: "+money(av));return}}
  const rec={id:editing||Date.now(),person,type,amount,date,note:$("note").value.trim()};
  if(editing)tx[tx.findIndex(t=>t.id===editing)]=rec;else tx.unshift(rec);
  persist();openName=person;resetForm();render();show("dash");toast("সেভ হয়েছে ✓");
}
function edit(id){const t=tx.find(x=>x.id===id);if(!t)return;editing=id;setType(t.type,t.person);$("amount").value=t.amount;
  $("date").value=t.date;$("note").value=t.note||"";$("saveBtn").textContent="আপডেট করুন";$("entryTitle").textContent="এন্ট্রি এডিট";$("cancelBtn").classList.remove("hidden");show("entry")}

/* ---------- ui ---------- */
function show(v){["dash","entry","set"].forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));scrollTo(0,0)}
function start(){
  cust=ls.get(CKEY,[]);bin=ls.get(BKEY,[]).filter(b=>Date.now()-b.at<30*864e5);persistB();tx=ls.get(KEY,null);
  if(!tx){tx=ls.get("moneyLedger",[]);if(tx.length)ls.set(KEY,tx)}
  resetForm();render();show("dash");
}
$("saveBtn").onclick=save;$("cancelBtn").onclick=()=>{resetForm();show("dash")};
$("search").oninput=render;$("person").oninput=fillSel;$("person").onfocus=fillSel;
$("person").onblur=()=>setTimeout(()=>$("sug").classList.add("hidden"),250);
$("sug").onmousedown=e=>e.preventDefault();
$("sug").onclick=e=>{const d=e.target.closest("[data-n]");if(d){$("person").value=d.dataset.n;$("sug").classList.add("hidden")}};$("addCust").onclick=()=>{const n=prompt("কাস্টমারের নাম");if(n===null||!n.trim())return;
  const ex=names().some(x=>x.toLowerCase()===n.trim().toLowerCase());addCust(n);render();toast(ex?"এই নামে কাস্টমার আগে থেকেই আছে":"কাস্টমার সেভ হয়েছে ✓")};
$("seg").onclick=e=>{const b=e.target.closest("button");if(b)setType(b.dataset.t)};
$("nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)};
$("peopleList").onclick=e=>{
  const g=a=>{const b=e.target.closest("["+a+"]");return b&&b.getAttribute(a)};
  let v;
  if((v=g("data-edit"))!==null&&v)return edit(Number(v));
  if((v=g("data-del"))){if(confirm("এই লেনদেন ডিলিট করবেন?")){const t=tx.find(x=>x.id===Number(v));if(t)toBin({kind:"tx",tx:t});tx=tx.filter(t=>t.id!==Number(v));persist();render();toast("রিসাইকেল বিনে গেছে")}return}
  if((v=g("data-pdf"))){pdf(v);return}
  if((v=g("data-delp"))){if(confirm(v+"-কে ও তার সব লেনদেন ডিলিট করবেন?")){toBin({kind:"cust",name:v,txs:tx.filter(t=>t.person.toLowerCase()===v.toLowerCase())});tx=tx.filter(t=>t.person.toLowerCase()!==v.toLowerCase());cust=cust.filter(c=>c.toLowerCase()!==v.toLowerCase());openName="";persist();persistC();render();toast("রিসাইকেল বিনে গেছে")}return}
  if((v=g("data-open"))){openName=openName===v?"":v;render()}
};
$("binList").onclick=e=>{
  const rs=e.target.closest("[data-rs]"),pg=e.target.closest("[data-pg]");
  const el=rs||pg;if(!el)return;
  const id=Number(el.getAttribute(rs?"data-rs":"data-pg")),b=bin.find(x=>Number(x.bid)===id);
  if(!b)return;
  if(rs){
    if(b.kind==="tx")tx.unshift(b.tx);
    else{tx=b.txs.concat(tx);addCust(b.name)}
    persist();bin=bin.filter(x=>x!==b);persistB();render();toast("ফিরিয়ে আনা হয়েছে ✓");
  }else if(confirm("চিরতরে মুছে ফেলবেন?")){bin=bin.filter(x=>x!==b);persistB();render()}
};
$("binClear").onclick=()=>{if(confirm("বিনের সব চিরতরে মুছে যাবে। চালিয়ে যাবেন?")){bin=[];persistB();render()}};
$("bkPdf").onclick=()=>pdf();
$("bkDl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({transactions:tx,customers:cust},null,2)],{type:"application/json"}));a.download="khata-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("bkRs").onclick=()=>$("restore").click();
$("restore").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const raw=JSON.parse(await f.text());const d=Array.isArray(raw)?raw:raw.transactions;const cs=!Array.isArray(raw)&&Array.isArray(raw.customers)?raw.customers.filter(c=>typeof c==="string"&&c.trim()):[];
    if(!Array.isArray(d)||!d.every(t=>t&&typeof t.person==="string"&&["take","return"].includes(t.type)&&Number.isFinite(t.amount)&&t.amount>0&&typeof t.date==="string"))throw 0;
    if(!confirm("বর্তমান হিসাবের জায়গায় ব্যাকআপের হিসাব বসবে। চালিয়ে যাবেন?"))return;
    tx=d;cust=cs;openName="";persist();persistC();render();toast("ফিরিয়ে আনা হয়েছে ✓")}catch(err){toast("ভুল ব্যাকআপ ফাইল")}
  e.target.value=""};

start();
</script>
</body>
</html>
