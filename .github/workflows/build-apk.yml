name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Apply custom app icon
        run: |
          if [ -f public/icon.png ]; then
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y imagemagick
            fi
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
              dir="${spec%%:*}"
              size="${spec##*:}"
              mkdir -p "android/app/src/main/res/$dir"
              convert public/icon.png -resize "${size}x${size}" "android/app/src/main/res/$dir/ic_launcher.png"
              convert public/icon.png -resize "${size}x${size}" "android/app/src/main/res/$dir/ic_launcher_round.png"
            done
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK output
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/khata.apk

      - name: Upload Khata APK
        uses: actions/upload-artifact@v7
        with:
          name: khata-apk
          path: apk-output/khata.apk
